<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leonardo Curaca</title>

    <!-- <script src="https://kit.fontawesome.com/a7882cf025.js" crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/all.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-solid.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-regular.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.2/css/sharp-light.css">

    <!-- Alpine -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Splide -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
        integrity="sha256-5uKiXEwbaQh9cgd2/5Vp6WmMnsUr3VZZw0a8rKnOKNU=" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/output.css">

</head>

<body x-data="{ sidebarOpen: false }" class="bg-dark">

    <div class="loader"></div>

    <div class="relative">

        <div x-show="sidebarOpen" class="fixed inset-0 z-50 overflow-hidden" aria-labelledby="slide-over-title"
            role="dialog" aria-modal="true" style="display: none;">
            <div x-show="sidebarOpen" x-transition:enter="ease-in-out duration-500" x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100" x-transition:leave="ease-in-out duration-500"
                x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="sidebarOpen = false"
                class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"></div>

            <div class="fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div x-show="sidebarOpen" x-transition:enter="transform transition ease-in-out duration-500"
                    x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
                    x-transition:leave="transform transition ease-in-out duration-500"
                    x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
                    class="w-screen max-w-md">
                    <div class="flex h-full flex-col overflow-y-scroll bg-secondary shadow-xl">
                        <div class="flex items-center justify-between p-4 border-b border-white/10">
                            <h2 class="text-lg font-medium text-white" id="slide-over-title">Website in development</h2>
                            <button @click="sidebarOpen = false" class="text-white/50 hover:text-white outline-none">
                                <i class="fa-light fa-xmark text-2xl"></i>
                            </button>
                        </div>

                        <div class="relative flex-1 flex flex-col justify-end px-4">
                            <img src="https://cdn.pixabay.com/photo/2019/04/28/06/55/crane-4162288_960_720.png"
                                alt="Crane" class="w-full invert opacity-50 grayscale">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex">
        <div class="flex-1 min-w-0">
            <div class="flex bg-secondary sticky top-0 z-10 border-b border-white/5">
                <a href="#"
                    class="flex items-center gap-2 px-6 py-2 bg-dark border-t-2 border-primary text-sm text-white">
                    <i class="fa-solid fa-code text-primary/80"></i>
                    index.html
                </a>
            </div>

            <div class="wrapper flex">
                <div id="numbar" class="bg-dark h-100 px-3 text-end text-white/50 py-2">
                    <ul class="list-unstyled"></ul>
                </div>
                <div id="wrapper-container" class="flex-1 min-w-0 px-3 py-10">
                    <section class="py-6 xl:py-12">
                        <div
                            class="flex flex-col-reverse md:flex-row items-center justify-center xl:justify-start gap-10">
                            <div class="w-full md:w-2/3 self-center">
                                <div class="text-white text-balance pb-8 text-center xl:text-left">
                                    <h1 class="typewriter text-4xl mb-4" text="Hey there!👋<br>I'm Leonardo Curaca">
                                    </h1>

                                    <p class="border-s-2 border-white/25 ps-4 text-white/50 leading-relaxed">
                                        I'm a <span class="text-blue-500 font-medium">Full Stack Developer</span> from
                                        <span class="text-red-500 font-medium">Peru</span> with a passion for creating
                                        <span class="text-emerald-500">beautiful</span> and
                                        <span class="text-emerald-500">user-friendly websites</span>, and
                                        <span class="text-amber-500 font-medium">innovative</span> and
                                        <span class="text-amber-500 font-medium">efficient applications</span>.
                                    </p>
                                </div>

                                <div class="flex flex-col gap-3">
                                    <a href="https://www.linkedin.com/in/leonardocuraca/" target="_blank"
                                        class="bg-secondary hover:bg-[#0073b1] transition-colors flex items-center gap-3 text-white py-3 px-6 rounded-lg">
                                        <i class="fa-brands fa-linkedin text-xl"></i>
                                        LinkedIn
                                    </a>
                                    <a href="https://github.com/SrLeo-projects" target="_blank"
                                        class="bg-secondary hover:bg-[#333] transition-colors flex items-center gap-3 text-white py-3 px-6 rounded-lg">
                                        <i class="fa-brands fa-github text-xl"></i>
                                        GitHub
                                    </a>
                                    <a href="https://api.whatsapp.com/send?phone=51943050013" target="_blank"
                                        class="bg-secondary hover:bg-[#06cf9c] transition-colors flex items-center gap-3 text-white py-3 px-6 rounded-lg">
                                        <i class="fa-brands fa-whatsapp text-xl"></i>
                                        WhatsApp
                                    </a>
                                    <a href="assets/pdf/Leonardo%20Curaca%20CV%20EN%202025.pdf" target="_blank"
                                        class="bg-secondary hover:bg-warning transition-colors flex items-center gap-3 text-white py-3 px-6 rounded-lg">
                                        <i class="fa-regular fa-file-pdf text-xl"></i>
                                        Download CV
                                    </a>
                                </div>
                            </div>
                            <div class="w-2/3 md:w-1/3 max-w-sm">
                                <div class="p-2 xl:p-4">
                                    <img src="assets/img/leo.jpg" alt="Leonardo Curaca"
                                        class="w-full aspect-square object-cover rounded-full border-4 border-zinc-800 shadow-2xl">
                                </div>
                            </div>
                        </div>
                    </section>

                    <hr class="border-white opacity-25">

                    <section class="text-white py-6 xl:py-12">
                        <div class="">
                            <div class="pb-6">
                                <h2 class="text-3xl md:text-4xl font-bold mb-2">Projects</h2>
                                <p class="text-white/50 border-l border-white/25 ps-4">
                                    Here you can find some of my <span
                                        class="text-emerald-400 font-medium">projects</span>
                                </p>
                            </div>
                            <div class="splide basic" id="projects" role="group">
                                <div class="splide__track">
                                    <ul class="splide__list" id="projects-list">
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="py-12">
                        <div class="py-12 text-center">
                            <h1 class="typewriter text-white" text="Coming soon..."></h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <aside class="sticky top-0 h-screen bg-dark px-3 py-2 border-l border-white/5">
            <div class="flex flex-col items-center gap-4">
                <button @click="sidebarOpen = true"
                    class="group flex items-center justify-center p-2 text-white/50 hover:text-white transition-all duration-200 focus:outline-none"
                    aria-label="Abrir archivos">
                    <i class="fa-light fa-files text-2xl group-hover:scale-110"></i>
                </button>

                <button @click="sidebarOpen = true"
                    class="group flex items-center justify-center p-2 text-white/50 hover:text-white transition-all duration-200 focus:outline-none"
                    aria-label="Buscar">
                    <i class="fa-light fa-search text-2xl group-hover:scale-110"></i>
                </button>

                <button @click="sidebarOpen = true"
                    class="group flex items-center justify-center p-2 text-white/50 hover:text-white transition-all duration-200 focus:outline-none"
                    aria-label="Compartir">
                    <i class="fa-light fa-share text-2xl group-hover:scale-110"></i>
                </button>

                <button @click="sidebarOpen = true"
                    class="group flex items-center justify-center p-2 text-white/50 hover:text-white transition-all duration-200 focus:outline-none"
                    aria-label="Descargar PDF">
                    <i class="fa-light fa-file-pdf text-2xl group-hover:scale-110"></i>
                </button>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>

    <script src="assets/js/projects.js"></script>
    <script src="assets/js/typewriter.js"></script>
    <script src="assets/js/numbar.js"></script>

    <!-- Splide -->
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"
        integrity="sha256-FZsW7H2V5X9TGinSjjwYJ419Xka27I8XPDmWryGlWtw=" crossorigin="anonymous"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-intersection@0.2.0/dist/js/splide-extension-intersection.min.js"
        integrity="sha256-JKADUEtliYhbM/9Tqt7qaeQb7T2XmLEKqJ068n6tcq0=" crossorigin="anonymous"></script>

    <script>
        const settings = {
            type: 'loop',
            perPage: 4,
            perMove: 1,
            gap: '1.5rem',
            breakpoints: {
                1200: {
                    perPage: 3
                },
                768: {
                    perPage: 2,
                    arrows: false
                },
                576: {
                    perPage: 1
                }
            }
        };

        const renderProjects = () => {
            const list = document.getElementById('projects-list');

            window.projectList.forEach(project => {
                const li = document.createElement('li');
                li.className = 'splide__slide';

                const privateBadge = project.isPrivate
                    ? `<i class="fa-solid fa-lock text-rose-500 text-xs" title="Private Project"></i>`
                    : '';

                const titleHtml = !project.isPrivate
                    ? `<a href="${project.url}" target="_blank" class="inline-flex items-center gap-2 text-white font-semibold mb-3 transition-colors ${project.hoverColor}">
                         <i class="${project.icon}"></i>
                         <span>${project.title}</span>
                       </a>`
                    : `<p class="flex items-center justify-between text-white font-semibold mb-3">
                         <span class="inline-flex items-center gap-2">
                            <i class="${project.icon}"></i>
                            <span>${project.title}</span>
                         </span>
                         ${privateBadge}
                       </p>`;

                li.innerHTML = `
                    <div class="h-full bg-secondary rounded-xl overflow-hidden group/card">
                        <div class="aspect-video relative group/img">
                            <img src="${project.img}" alt="${project.title}" class="w-full h-full object-cover">
                            <img src="${project.hoverImg}" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover/img:opacity-100 transition-opacity duration-500">
                        </div>
                        <div class="p-5">
                            ${titleHtml}
                            <p class="text-white/60 text-sm leading-relaxed">${project.description}</p>
                        </div>
                    </div>
                `;

                list.appendChild(li);
            });
        };

        renderProjects();
        new Splide('#projects', settings).mount();
    </script>

</body>

</html>
